<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Knockout Predictor</title>
    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2236;
            --bg-card-hover: #1e2a42;
            --border-color: #2a3a5c;
            --accent: #3b82f6;
            --accent-glow: #60a5fa;
            --gold: #f59e0b;
            --gold-glow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --win: #22c55e;
            --lose: #ef4444;
            --draw: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: auto;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(26, 34, 54, 0.9) 0%, transparent 100%);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-glow), var(--gold-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .header-buttons {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-block;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
        }

        .btn:hover {
            color: var(--text-primary);
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-glow);
            border-color: var(--accent-glow);
        }

        /* ===== TABS ===== */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 0;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .tab-btn {
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--accent-glow);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== GROUP STAGE ===== */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .group-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .group-card-header {
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05));
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-glow);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .standings-table th {
            padding: 6px 8px;
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .standings-table th:not(:first-child) {
            text-align: center;
        }

        .standings-table td {
            padding: 5px 8px;
            border-bottom: 1px solid rgba(42,58,92,0.3);
        }

        .standings-table td:not(:first-child) {
            text-align: center;
            color: var(--text-secondary);
        }

        .standings-table tr:nth-child(1) td:first-child,
        .standings-table tr:nth-child(2) td:first-child {
            color: var(--win);
        }

        .standings-table tr:nth-child(3) td:first-child {
            color: var(--draw);
        }

        .group-matches {
            padding: 8px;
        }

        .group-match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px;
            font-size: 12px;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .group-match-row:hover {
            background: rgba(59,130,246,0.08);
        }

        .group-match-teams {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .group-match-score {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .score-input {
            width: 28px;
            height: 24px;
            text-align: center;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        .score-input:focus {
            border-color: var(--accent);
        }

        .score-input:disabled {
            opacity: 0.3;
        }

        .match-separator {
            color: var(--text-muted);
            font-size: 11px;
        }

        .team-flag-small {
            width: 18px;
            height: 12px;
            border-radius: 1px;
        }

        .team-code {
            font-weight: 600;
            color: var(--text-primary);
            min-width: 28px;
        }

        /* ===== BRACKET CONTAINER ===== */
        .bracket-wrapper {
            padding: 20px 10px;
            overflow-x: auto;
        }

        .bracket {
            display: flex;
            align-items: center;
            width: fit-content;
            margin: 0 auto;
            gap: 0;
        }

        /* ===== SIDE (LEFT / RIGHT) ===== */
        .side {
            display: flex;
            flex-direction: column;
        }

        .side-left {
            align-items: flex-end;
        }

        .side-right {
            align-items: flex-start;
        }

        /* ===== ROUND COLUMN ===== */
        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            position: relative;
        }

        .round-left {
            padding-right: 14px;
        }

        .round-right {
            padding-left: 14px;
        }

        .round-label {
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* ===== MATCH CARD ===== */
        .match-wrap {
            padding: 8px 0;
        }

        .match {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            width: 120px;
            transition: all 0.2s ease;
            cursor: default;
        }

        .match:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        .match.match-final {
            width: 140px;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
        }

        .match.match-final:hover {
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.35);
        }

        .match-final-label {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            padding: 8px 0 4px;
        }

        .team-row {
            display: flex;
            align-items: center;
            padding: 0;
            height: 32px;
            transition: background 0.15s ease;
        }

        .team-row:first-of-type {
            border-bottom: 1px solid rgba(42, 58, 92, 0.5);
        }

        .team-row.winner {
            background: rgba(34, 197, 94, 0.08);
        }

        .team-row.loser {
            opacity: 0.5;
        }

        .team-flag {
            width: 22px;
            height: 15px;
            margin-left: 6px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .team-name {
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            padding: 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .team-row.winner .team-name {
            color: var(--win);
        }

        .team-row.loser .team-name {
            color: var(--text-muted);
        }

        .team-score {
            min-width: 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            padding: 0 5px;
            cursor: pointer;
            transition: background 0.15s ease;
            border-left: 1px solid rgba(42, 58, 92, 0.5);
            color: var(--text-secondary);
            user-select: none;
        }

        .team-score:hover {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-glow);
        }

        .team-score.editing {
            background: rgba(59, 130, 246, 0.2);
        }

        .team-score input {
            width: 20px;
            text-align: center;
            background: transparent;
            border: none;
            outline: none;
            color: var(--accent-glow);
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            -moz-appearance: textfield;
        }

        .team-score input::-webkit-outer-spin-button,
        .team-score input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .team-row.winner .team-score {
            color: var(--win);
        }

        .team-row.loser .team-score {
            color: var(--text-muted);
        }

        /* ===== EMPTY TEAM ===== */
        .team-row.empty {
            opacity: 0.3;
        }

        .team-row.empty .team-name {
            color: var(--text-muted);
            font-style: italic;
            font-weight: 400;
        }

        /* ===== CHAMPION ===== */
        .champion-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 6px;
        }

        .champion-card {
            background: linear-gradient(135deg, #1a2236, #1e2a42);
            border: 2px solid var(--gold);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            min-width: 110px;
            box-shadow:
                0 0 40px rgba(245, 158, 11, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .champion-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .champion-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold-glow);
            min-height: 22px;
        }

        .champion-trophy {
            font-size: 30px;
            margin-bottom: 4px;
        }

        /* ===== FINAL CONNECTORS ===== */
        .final-connector {
            width: 14px;
            position: relative;
        }

        .final-connector::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 100%;
            height: 0;
            border-top: 2px solid var(--border-color);
        }

        .final-connector-left::before {
            left: 0;
        }

        .final-connector-right::before {
            right: 0;
        }

        /* ===== ROUND HEIGHTS ===== */
        .round-32 { min-height: 560px; }
        .round-16 { min-height: 560px; }
        .round-qf { min-height: 560px; }
        .round-sf { min-height: 560px; }

        .match-list {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
        }

        /* ===== SCROLL HINT ===== */
        .scroll-hint {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (min-width: 1100px) {
            .scroll-hint {
                display: none;
            }
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏆 FIFA 2026 World Cup</h1>
        <p>Group Stage & Knockout Bracket Predictor</p>
        <div class="header-buttons">
            <button class="btn btn-primary" onclick="seedBracket()">Seed Bracket from Groups</button>
            <button class="btn" onclick="resetAll()">Reset All</button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="showTab('groups')">Group Stage</button>
        <button class="tab-btn" onclick="showTab('bracket')">Knockout Bracket</button>
    </div>

    <!-- GROUP STAGE TAB -->
    <div id="tab-groups" class="tab-content active">
        <div class="groups-grid" id="groups-container">
            <div class="loading">Loading groups...</div>
        </div>
    </div>

    <!-- BRACKET TAB -->
    <div id="tab-bracket" class="tab-content">
        <div class="scroll-hint">← Scroll horizontally to see the full bracket →</div>
        <div class="bracket-wrapper">
            <div class="bracket" id="bracket"></div>
        </div>
    </div>

    <script>
        // ===== STATE =====
        let TEAMS = {};
        let GROUPS = {};
        let bracketData = null;

        // ===== API HELPERS =====
        async function apiGet(url) {
            const res = await fetch(url);
            return res.json();
        }

        async function apiPost(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return res.json();
        }

        // ===== INIT =====
        async function init() {
            const data = await apiGet('/api/teams');
            for (const [code, info] of Object.entries(data)) {
                TEAMS[code] = info;
            }
            const groupsData = await apiGet('/api/groups');
            GROUPS = groupsData.groups;
            await loadGroupStage();
            await loadBracket();
        }

        // ===== TAB SWITCHING =====
        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        // ===== FLAG HELPER =====
        function flagImg(code) {
            const t = TEAMS[code];
            if (!t) return '<span>⚽</span>';
            return `<img src="https://flagcdn.com/w20/${t.flag}.png"
                         srcset="https://flagcdn.com/w40/${t.flag}.png 2x"
                         alt="${t.name}" title="${t.name}" width="18" height="12"
                         style="display:block;border-radius:1px;">`;
        }

        function flagImgLarge(code) {
            const t = TEAMS[code];
            if (!t) return '<span>⚽</span>';
            return `<img src="https://flagcdn.com/w20/${t.flag}.png"
                         srcset="https://flagcdn.com/w40/${t.flag}.png 2x"
                         alt="${t.name}" title="${t.name}" width="22" height="15"
                         style="display:block;border-radius:2px;">`;
        }

        // ===== GROUP STAGE RENDERING =====
        async function loadGroupStage() {
            const data = await apiGet('/api/standings');
            const matchesData = await apiGet('/api/group-matches');

            const container = document.getElementById('groups-container');
            let html = '';

            for (const group of ['A','B','C','D','E','F','G','H','I','J','K','L']) {
                const standings = data.standings[group];
                const groupMatches = matchesData.matches.filter(m => m.group === group);

                html += `<div class="group-card">`;
                html += `<div class="group-card-header">Group ${group}</div>`;

                // Standings table
                html += `<table class="standings-table">
                    <thead><tr>
                        <th>Team</th><th>P</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
                    </tr></thead><tbody>`;

                for (const s of standings) {
                    const gd = s.goalDifference >= 0 ? `+${s.goalDifference}` : s.goalDifference;
                    html += `<tr>
                        <td style="display:flex;align-items:center;gap:4px;">
                            ${flagImg(s.teamCode)}
                            <span class="team-code">${s.teamCode}</span>
                        </td>
                        <td>${s.played}</td>
                        <td>${s.goalsFor}</td>
                        <td>${s.goalsAgainst}</td>
                        <td>${gd}</td>
                        <td style="font-weight:700;color:var(--text-primary)">${s.points}</td>
                    </tr>`;
                }
                html += `</tbody></table>`;

                // Matches
                html += `<div class="group-matches">`;
                for (const m of groupMatches) {
                    html += `<div class="group-match-row">
                        <div class="group-match-teams">
                            ${flagImg(m.team1)}
                            <span class="team-code">${m.team1}</span>
                        </div>
                        <div class="group-match-score">
                            <input type="number" class="score-input" min="0" max="99"
                                   value="${m.score1 !== null ? m.score1 : ''}"
                                   placeholder="-"
                                   onchange="setGroupScore('${m.id}', 1, this.value)"
                                   onfocus="this.select()">
                            <span class="match-separator">-</span>
                            <input type="number" class="score-input" min="0" max="99"
                                   value="${m.score2 !== null ? m.score2 : ''}"
                                   placeholder="-"
                                   onchange="setGroupScore('${m.id}', 2, this.value)"
                                   onfocus="this.select()">
                        </div>
                        <div class="group-match-teams" style="justify-content:flex-end;">
                            <span class="team-code">${m.team2}</span>
                            ${flagImg(m.team2)}
                        </div>
                    </div>`;
                }
                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        async function setGroupScore(matchId, slot, value) {
            // Find the current scores for this match from the inputs
            const row = event.target.closest('.group-match-row');
            const inputs = row.querySelectorAll('.score-input');
            const s1 = inputs[0].value !== '' ? parseInt(inputs[0].value) : null;
            const s2 = inputs[1].value !== '' ? parseInt(inputs[1].value) : null;

            if (s1 === null || s2 === null) return; // Need both scores

            await apiPost(`/api/groups/${matchId}/score`, { score1: s1, score2: s2 });
            await loadGroupStage();
        }

        // ===== BRACKET RENDERING =====
        async function loadBracket() {
            const data = await apiGet('/api/bracket');
            bracketData = data;
            renderBracket();
        }

        function renderBracket() {
            if (!bracketData) return;

            const matches = {};
            bracketData.matches.forEach(m => { matches[m.id] = m; });

            const bracket = document.getElementById('bracket');

            // Separate by round and side
            const leftR32 = [], leftR16 = [], leftQF = [], leftSF = [];
            const rightR32 = [], rightR16 = [], rightQF = [], rightSF = [];
            let finalMatch = null;

            for (const m of bracketData.matches) {
                if (m.round === 'R32' && m.side === 'left') leftR32.push(m);
                if (m.round === 'R16' && m.side === 'left') leftR16.push(m);
                if (m.round === 'QF' && m.side === 'left') leftQF.push(m);
                if (m.round === 'SF' && m.side === 'left') leftSF.push(m);
                if (m.round === 'R32' && m.side === 'right') rightR32.push(m);
                if (m.round === 'R16' && m.side === 'right') rightR16.push(m);
                if (m.round === 'QF' && m.side === 'right') rightQF.push(m);
                if (m.round === 'SF' && m.side === 'right') rightSF.push(m);
                if (m.round === 'Final') finalMatch = m;
            }

            const sortFn = (a, b) => a.matchIndex - b.matchIndex;
            leftR32.sort(sortFn); leftR16.sort(sortFn); leftQF.sort(sortFn); leftSF.sort(sortFn);
            rightR32.sort(sortFn); rightR16.sort(sortFn); rightQF.sort(sortFn); rightSF.sort(sortFn);

            const finalWinner = getWinner(finalMatch);

            let html = '';

            // LEFT SIDE
            html += renderRound(leftR32, 'Round of 32', 'left');
            html += renderRound(leftR16, 'Round of 16', 'left');
            html += renderRound(leftQF, 'Quarter-Finals', 'left');
            html += renderRound(leftSF, 'Semi-Finals', 'left');

            // LEFT CONNECTOR → FINAL
            html += `<div class="final-connector final-connector-left"></div>`;

            // FINAL + CHAMPION
            html += `<div class="champion-section">
                <div class="champion-card">
                    <div class="champion-trophy">🏆</div>
                    <div class="champion-label">Champion</div>
                    <div class="champion-name" title="${finalWinner ? TEAMS[finalWinner]?.name || '' : ''}">
                        ${finalWinner ? flagImgLarge(finalWinner) + ' ' + finalWinner : '???'}
                    </div>
                </div>
                ${renderMatch(finalMatch)}
            </div>`;

            // RIGHT CONNECTOR → FINAL
            html += `<div class="final-connector final-connector-right"></div>`;

            // RIGHT SIDE
            html += renderRound(rightSF, 'Semi-Finals', 'right');
            html += renderRound(rightQF, 'Quarter-Finals', 'right');
            html += renderRound(rightR16, 'Round of 16', 'right');
            html += renderRound(rightR32, 'Round of 32', 'right');

            bracket.innerHTML = html;
        }

        function getWinner(match) {
            if (!match || match.score1 === null || match.score2 === null) return null;
            if (match.score1 > match.score2) return match.team1;
            if (match.score2 > match.score1) return match.team2;
            return null;
        }

        function renderTeamRow(teamCode, score, matchId, slot, isWinner, isLoser) {
            if (!teamCode) {
                return `<div class="team-row empty">
                    <span class="team-flag">⚽</span>
                    <span class="team-name">TBD</span>
                    <span class="team-score">-</span>
                </div>`;
            }

            let classes = 'team-row';
            if (isWinner) classes += ' winner';
            if (isLoser) classes += ' loser';

            const scoreDisplay = score !== null && score !== undefined ? score : '-';

            return `<div class="${classes}">
                <span class="team-flag" title="${TEAMS[teamCode]?.name || teamCode}">${flagImgLarge(teamCode)}</span>
                <span class="team-name">${teamCode}</span>
                <span class="team-score" onclick="editKnockoutScore(${matchId}, ${slot}, this)"
                      data-match="${matchId}" data-slot="${slot}">${scoreDisplay}</span>
            </div>`;
        }

        function renderMatch(match) {
            if (!match) return '';
            const winner = getWinner(match);
            const isTeam1Winner = winner && winner === match.team1;
            const isTeam2Winner = winner && winner === match.team2;

            let cls = 'match';
            if (match.round === 'Final') cls += ' match-final';

            let html = '';
            if (match.round === 'Final') {
                html += `<div class="match-final-label">🏆 Final</div>`;
            }

            html += renderTeamRow(match.team1, match.score1, match.id, 1,
                isTeam1Winner, isTeam2Winner && !isTeam1Winner);
            html += renderTeamRow(match.team2, match.score2, match.id, 2,
                isTeam2Winner, isTeam1Winner && !isTeam2Winner);

            return `<div class="match-wrap"><div class="${cls}" data-match="${match.id}">${html}</div></div>`;
        }

        function renderRound(matchList, label, side) {
            const matchHtmls = matchList.map(m => renderMatch(m)).join('');
            return `<div class="round round-${side}">
                <div class="round-label">${label}</div>
                <div class="match-list">${matchHtmls}</div>
            </div>`;
        }

        // ===== KNOCKOUT SCORE EDITING =====
        function editKnockoutScore(matchId, slot, el) {
            if (el.querySelector('input')) return;

            const match = bracketData.matches.find(m => m.id === matchId);
            if (!match) return;
            const team = slot === 1 ? match.team1 : match.team2;
            if (!team) return;

            const currentVal = slot === 1 ? match.score1 : match.score2;
            const displayVal = currentVal !== null && currentVal !== undefined ? currentVal : '';

            el.classList.add('editing');
            el.innerHTML = `<input type="number" min="0" max="99" value="${displayVal}" />`;
            const input = el.querySelector('input');
            input.focus();
            input.select();

            async function commit() {
                let val = input.value.trim();
                let numVal = val === '' ? null : parseInt(val, 10);
                if (numVal !== null && isNaN(numVal)) numVal = null;
                if (numVal !== null && numVal < 0) numVal = 0;

                if (numVal !== null) {
                    const s1 = slot === 1 ? numVal : match.score1;
                    const s2 = slot === 2 ? numVal : match.score2;
                    if (s1 !== null && s2 !== null) {
                        await apiPost(`/api/bracket/${matchId}/score`, { score1: s1, score2: s2 });
                        await loadBracket();
                    }
                }

                el.classList.remove('editing');
            }

            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') input.blur();
                if (e.key === 'Escape') {
                    el.classList.remove('editing');
                    const scoreDisplay = (slot === 1 ? match.score1 : match.score2);
                    el.textContent = scoreDisplay !== null && scoreDisplay !== undefined ? scoreDisplay : '-';
                }
            });
        }

        // ===== SEED & RESET =====
        async function seedBracket() {
            await apiPost('/api/bracket/seed');
            await loadBracket();
        }

        async function resetAll() {
            await apiPost('/api/reset');
            await loadGroupStage();
            await loadBracket();
        }

        // ===== STARTUP =====
        init();
    </script>
</body>
</html>
