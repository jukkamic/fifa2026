<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Knockout Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>🏆 FIFA 2026 World Cup</h1>
        <p>Group Stage & Knockout Bracket Predictor</p>
        <div class="header-buttons">
            <button class="btn btn-primary" onclick="seedBracket()">Seed Bracket from Groups</button>
        </div>
        <div class="header-status">
            <span id="user-email" class="user-email"></span>
        </div>
        <div class="header-status">
            <span id="save-status" class="save-status"></span>
        </div>
    </div>

    <div id="notifications-container" class="notifications-container"></div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="showTab('groups')">Group Stage</button>
        <button class="tab-btn" onclick="showTab('bracket')">Knockout Bracket</button>
    </div>

    <!-- GROUP STAGE TAB -->
    <div id="tab-groups" class="tab-content active">
        <div style="text-align:center;margin-bottom:0px;">
            <button class="btn btn-betfair" id="btn-simulate-betfair" onclick="simulateBetfairGroups()">
                🎲 Simulate Group Stage via Betfair Odds
                <span id="odds-snapshot-time" class="odds-snapshot-time"></span>
            </button>
        </div>
        <div class="groups-grid" id="groups-container">
            <div class="loading">Loading groups...</div>
        </div>
    </div>

    <!-- BRACKET TAB -->
    <div id="tab-bracket" class="tab-content">
        <div class="scroll-hint">← Scroll horizontally to see the full bracket →</div>
        <div class="bracket-wrapper">
            <div class="bracket" id="bracket"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
