spring.application.name=fifa

# ── H2 Database (file-based persistence) ────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/fifa
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ── Betfair Integration ────────────────────────────────────────────────────
# Defaults to empty — in prod the Betfair config bean is disabled (@Profile("!prod"))
# so these are not needed. In dev, values come from .env via spring-dotenv.
betfair.api-key=${BETFAIR_API_KEY:}
betfair.username=${BETFAIR_USERNAME:}
betfair.password=${BETFAIR_PASSWORD:}
betfair.cert-path=${BETFAIR_CERT_PATH:}

# ── Cloudflare Zero Trust (JWT validation) ──────────────────────────────────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://scaffoldkit.cloudflareaccess.com/cdn-cgi/access/certs

# ── Application Data Directory ────────────────────────────────────────────
app.data.dir=./data

# ── Admin Users ──────────────────────────────────────────────────────────
app.admin.email=jukkamic@gmail.com
app.admin.dev-email=testuser@example.com

# ── Cloudflare Access JWT for odds push to production ──────────────────────
admin.cloudflare.jwt=${ADMIN_CLOUDFLARE_JWT:}
